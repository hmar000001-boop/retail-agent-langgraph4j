name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      llm_provider:
        description: "LLM used by the tests"
        type: choice
        options: [simulated, real]
        default: simulated
      record:
        description: "Record cassettes from the real model (only with provider=real)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-test:
    # Default path: simulated LLM. No secrets, no network, no cost: safe for fork PRs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test (simulated LLM)
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  real-llm:
    # Manual only: Actions tab -> ci -> Run workflow -> llm_provider=real
    if: github.event_name == 'workflow_dispatch' && inputs.llm_provider == 'real'
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Contract tests against OpenAI
        run: mvn -B -ntp test -Dapp.llm.provider=real -Dapp.llm.record=${{ inputs.record }}
      - name: Upload recorded cassettes
        if: inputs.record
        uses: actions/upload-artifact@v4
        with:
          name: cassettes
          path: src/test/resources/cassettes

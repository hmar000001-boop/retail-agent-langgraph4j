name: Verify retail-agent comparison workspace

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify wrapper and toolchain
        run: |
          chmod +x ./mvnw
          ./mvnw --version
          java -version
      - name: Build and test all modules with simulated providers
        run: ./mvnw -B -ntp -Dapp.llm.provider=simulated clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retail-agent-test-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          if-no-files-found: warn

  verify-postgres-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_DB: langgraph4j
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: phase2-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d langgraph4j"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_GRAPH_CHECKPOINT_BACKEND: postgres
      APP_GRAPH_CHECKPOINT_HOST: localhost
      APP_GRAPH_CHECKPOINT_PORT: 5432
      APP_GRAPH_CHECKPOINT_DATABASE: langgraph4j
      APP_GRAPH_CHECKPOINT_USERNAME: postgres
      APP_GRAPH_CHECKPOINT_PASSWORD: phase2-ci-only-password
      APP_GRAPH_CHECKPOINT_CREATE_TABLES: true
      APP_LLM_PROVIDER: simulated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify PostgreSQL-backed LangGraph4j runtime
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp -pl retail-agent-langgraph4j -am test
      - name: Upload PostgreSQL test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retail-agent-postgres-test-reports
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: warn

app:
  llm:
    # THE FLAG: real | simulated  (lowercase)
    provider: ${APP_LLM_PROVIDER:simulated}
    # hash = deterministic local embeddings (default, also when provider=real); real = OpenAI embeddings
    embeddings: ${APP_LLM_EMBEDDINGS:hash}
    # when provider=simulated: scripted | replay
    simulation: ${APP_LLM_SIMULATION:scripted}
    cassette-dir: ${APP_LLM_CASSETTE_DIR:src/test/resources/cassettes}
    record: ${APP_LLM_RECORD:false} # opt-in only; cassettes can contain private prompt data
    model-name: ${OPENAI_MODEL:gpt-4o-mini}
    api-key: ${OPENAI_API_KEY:}
    timeout: ${APP_LLM_TIMEOUT:60s}
    max-retries: ${APP_LLM_MAX_RETRIES:2}
    # optional fault injection, e.g.:
    # faults:
    #   - task: PROPOSE
    #     kind: malformed_json   # timeout | malformed_json | empty | low_confidence
    #     skip: 0
    #     times: 1
    selector:
      embedding:
        real: openai
        hash: none
  agent:
    max-iterations: 3          # outer action-observation cycles
    clarify-threshold: 0.4
    max-failures: 4
    max-planning-rounds: 3
    max-tool-calls: 3
    max-model-calls: 8
    max-recovery-attempts: 2
    memory-token-budget: 180
    workspace-token-budget: 260

  memory:
    backend: ${APP_MEMORY_BACKEND:memory} # memory is local/test only; production profile requires postgres
    initialize-schema: ${APP_MEMORY_INITIALIZE_SCHEMA:true}

  graph:
    checkpoint:
      backend: ${APP_GRAPH_CHECKPOINT_BACKEND:memory} # memory is local/test only; production profile requires postgres
      host: ${APP_GRAPH_CHECKPOINT_HOST:localhost}
      port: ${APP_GRAPH_CHECKPOINT_PORT:5432}
      database: ${APP_GRAPH_CHECKPOINT_DATABASE:langgraph4j}
      username: ${APP_GRAPH_CHECKPOINT_USERNAME:postgres}
      password: ${APP_GRAPH_CHECKPOINT_PASSWORD:}
      create-tables: ${APP_GRAPH_CHECKPOINT_CREATE_TABLES:true}

spring:
  datasource:
    url: ${APP_MEMORY_JDBC_URL:jdbc:postgresql://localhost:5432/langgraph4j}
    username: ${APP_MEMORY_JDBC_USERNAME:postgres}
    password: ${APP_MEMORY_JDBC_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  ai:
    model:
      # Spring AI remains the vector-store/embedding adapter in this phase, not the chat provider.
      chat: none
      embedding: ${app.llm.selector.embedding.${app.llm.embeddings}}
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      api-key: ${OPENAI_API_KEY:}
